<title>Card Check — Playtest · Permadeath Media</title>
<meta name="description" content="Card Check: a cooperative card game about running a union drive inside a game studio. Online playtest build from Permadeath Media.">
<link rel="preconnect" href="https://fonts.googleapis.com">

<style>

  --sel:#f6c34c;--sel-ink:#1c2230;

}

  --bg:#161a22;--panel:#1f2430;--ink:#e8ebf0;--muted:#9aa5b5;--line:#343b48;--soft:#262c38;
  --hostile:#3a2422;--undecided:#262c38;--leaning:#1f2d40;--signed:#1f3328;--steward:#20402b;

  --red:#f28b84;--amber:#e8bc5a;--ok:#6fd49a;
}}
:root[data-theme="dark"]{
  --bg:#161a22;--panel:#1f2430;--ink:#e8ebf0;--muted:#9aa5b5;--line:#343b48;--soft:#262c38;

}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 "IBM Plex Sans",system-ui,sans-serif}
h1,h2,h3{font-family:"Barlow Condensed","IBM Plex Sans",sans-serif;font-weight:700;letter-spacing:.01em;margin:0}
h1{font-size:34px;line-height:1}
h2{font-size:20px}
h3{font-size:16px;color:var(--muted);font-weight:600}
button{font:inherit;color:inherit;background:var(--soft);border:1px solid var(--line);border-radius:6px;padding:7px 12px;cursor:pointer}
button:hover{border-color:var(--accent)}
button:focus-visible{outline:3px solid var(--sel);outline-offset:1px}
button:disabled{opacity:.45;cursor:default}
button.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:600}
button.armed{background:var(--sel);color:var(--sel-ink);border-color:var(--sel);font-weight:600}
input{font:inherit;padding:8px 10px;border:1px solid var(--line);border-radius:6px;background:var(--panel);color:var(--ink)}
.wrap{max-width:1360px;margin:0 auto;padding:14px}
.home{display:inline-block;padding:5px 10px;border:1px solid var(--line);border-radius:6px;background:var(--panel);font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink);text-decoration:none;white-space:nowrap}
.home:hover{border-color:var(--accent);color:var(--accent)}
.credit{max-width:1360px;margin:0 auto;padding:4px 14px 20px;font-size:12px;color:var(--muted)}
.top{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap;margin-bottom:12px}
.top .sub{color:var(--muted)}
.top .spacer{flex:1}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px}
.grid{display:grid;grid-template-columns:260px 1fr 300px;gap:12px;align-items:start}
@media (max-width:1050px){.grid{grid-template-columns:1fr}.side{order:2}.board-wrap{order:1}.right{order:3}}
.stack>*+*{margin-top:12px}

/* lobby */
.lobby{max-width:720px;margin:30px auto}
.lobby .row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.seats{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px;margin-top:10px}
.seat{border:1px solid var(--line);border-radius:8px;padding:10px;background:var(--soft);cursor:pointer}
.seat.mine{border-color:var(--accent);box-shadow:inset 0 0 0 2px var(--accent)}
.seat.taken{opacity:.6;cursor:default}
.seat b{display:block;font-family:"Barlow Condensed";font-size:18px}
.seat small{color:var(--muted);display:block}
.code{font-family:"Barlow Condensed";font-size:28px;letter-spacing:.12em}

/* board */
.board{display:grid;grid-template-columns:28px 86px repeat(5,1fr);gap:4px}
.board .hdr{text-align:center;font-family:"Barlow Condensed";font-weight:700;font-size:15px;padding:4px 0;color:var(--muted)}
.board .hdr.hostile{color:var(--red)}
.cell{min-height:92px;border-radius:6px;padding:4px;display:flex;flex-wrap:wrap;gap:4px;align-content:flex-start}
.cell.c0{background:var(--hostile)}.cell.c1{background:var(--undecided)}.cell.c2{background:var(--leaning)}.cell.c3{background:var(--signed)}.cell.c4{background:var(--steward)}
.deptlab{writing-mode:vertical-rl;transform:rotate(180deg);color:#fff;font-family:"Barlow Condensed";font-weight:700;font-size:13px;border-radius:5px;display:flex;align-items:center;justify-content:center;letter-spacing:.06em}
.pile{border:1.5px dashed var(--line);border-radius:6px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:12px;color:var(--muted);cursor:pointer;padding:4px;gap:2px}
.pile.ok{border-color:var(--accent);color:var(--ink);background:var(--soft)}
.pile .n{font-family:"Barlow Condensed";font-size:22px;font-weight:700;line-height:1}
.pile.inoc{box-shadow:inset 0 0 0 2px var(--amber)}
.wk{background:var(--panel);border:1px solid var(--line);border-radius:5px;padding:4px 6px;font-size:12px;line-height:1.2;width:100%;height:52px;cursor:default;position:relative;display:flex;flex-direction:column;justify-content:space-between;overflow:hidden}
.wk b{display:flex;align-items:center;gap:3px;font-size:13px;white-space:nowrap;overflow:hidden}
.wk b .nm{overflow:hidden;text-overflow:ellipsis;min-width:0}
.wk b .st{flex:none;font-size:12px}
.wk .r{display:block;color:var(--muted);font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.wk .i{display:block;font-size:10.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.wk .inf{flex:none;font-size:10px;letter-spacing:1px;margin-left:auto;color:var(--ink)}
.wk.sel{cursor:pointer;box-shadow:0 0 0 2px var(--sel)}
.wk.inoc{transform:rotate(-6deg);border-color:var(--amber);box-shadow:0 0 0 1.5px var(--amber)}

@media (max-width:700px){.board{grid-template-columns:22px 26px repeat(5,1fr)}.wk{width:100%;min-width:0}.wk .r,.wk .i,.wk .inf{display:none}.wk b{font-size:11px}.wk{padding:3px 4px;height:30px;justify-content:center}.board .hdr{font-size:11px}.pile{font-size:10px}.pile .n{font-size:16px}.deptlab{font-size:10px}}

/* organizers */

.org.active{border-color:var(--accent);box-shadow:inset 0 0 0 2px var(--accent)}
.org .nm{font-family:"Barlow Condensed";font-weight:700;font-size:18px;display:flex;justify-content:space-between;align-items:baseline}

.org .ab{font-size:12px;color:var(--muted)}
.org .ab.lost{text-decoration:line-through}

.actions{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:8px}
.actions button{padding:7px 6px;font-size:13px}
.hint{font-size:13px;color:var(--muted);margin-top:8px;min-height:1.4em}
.hint.warn{color:var(--red)}
.prompt{background:var(--sel);color:var(--sel-ink);padding:8px 10px;border-radius:6px;font-weight:600;margin-top:8px}

.fear .dial{width:92px;height:92px;flex:none}
.fear .num{font-family:"Barlow Condensed";font-size:44px;font-weight:700;line-height:1}
.fear .lab{color:var(--muted);font-size:13px}
.fearnotes{font-size:12px;color:var(--muted)}

.issue{border:1px solid var(--line);border-radius:6px;padding:6px 8px;font-size:13px;display:flex;justify-content:space-between;align-items:center;gap:6px}
.issue.ready{border-color:var(--ok)}
.issue.done{opacity:.5}
.issue.gone{opacity:.4;text-decoration:line-through}
.issue b{display:block}
.issue small{color:var(--muted)}
.issue .req{font-family:"Barlow Condensed";font-size:18px;font-weight:700;white-space:nowrap}

/* management row */
.mrow{display:grid;grid-template-columns:repeat(9,1fr);gap:6px}
.slot{border:1.5px dashed var(--line);border-radius:6px;min-height:64px;padding:4px;font-size:11px;text-align:center;color:var(--muted);position:relative}
.slot.filled{border-style:solid;background:var(--soft);color:var(--ink)}
.slot.now{border-color:var(--accent);border-style:solid}
.slot .n{font-family:"Barlow Condensed";font-weight:700;font-size:14px}
.slot .cards{font-size:10px;line-height:1.2}
.slot .iss{display:inline-block;width:10px;height:7px;background:#e9d27a;border:1px solid #9a7a1a;border-radius:1px;margin:1px}

.mcard.t1{border-left-color:#718096}.mcard.t2{border-left-color:#c05621}.mcard.t3{border-left-color:#9b2c2c}
.mcard b{font-family:"Barlow Condensed";font-size:17px}
.mcard .how{color:var(--muted);font-size:12px}
.log{font-size:12px;max-height:240px;overflow:auto;border-top:1px solid var(--line);padding-top:6px}
.log div{padding:2px 0;border-bottom:1px dotted var(--line)}
.log .r{font-weight:600;color:var(--accent);margin-top:4px}
.banner{padding:14px;border-radius:8px;font-family:"Barlow Condensed";font-size:26px;text-align:center}
.banner.win{background:var(--signed);color:var(--ok)}
.banner.loss{background:var(--hostile);color:var(--red)}
.small{font-size:12px;color:var(--muted)}
.phase{font-family:"Barlow Condensed";font-weight:700;font-size:22px}
.toast{position:fixed;left:50%;bottom:calc(16px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:8px 14px;border-radius:8px;font-size:13px;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.show{opacity:1}
/* tutorial, callouts, rules */
.tut,.callout{position:sticky;top:0;z-index:5;background:var(--panel);border:1px solid var(--line);border-left:5px solid var(--sel);border-radius:10px;padding:12px 14px;margin-bottom:12px;box-shadow:0 4px 14px rgba(0,0,0,.14)}
.callout{border-left-color:var(--accent)}
.tut .th{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.tut h2,.callout h2{font-size:20px}
.tut .step{font-size:12px;color:var(--muted);margin-left:auto;white-space:nowrap}
.tut p,.callout p{margin:6px 0 0;font-size:14px;max-width:72ch}
.tut .row,.callout .row{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap;align-items:center}
.tut .row .small{margin-left:auto}
.tut-target{box-shadow:0 0 0 3px var(--sel),0 0 16px var(--sel)!important;position:relative;z-index:1;animation:tutpulse 1.2s ease-in-out infinite}
button.tut-target{border-color:var(--sel)}
.tut-spot{outline:3px solid var(--sel);outline-offset:3px;border-radius:8px}
@keyframes tutpulse{0%,100%{box-shadow:0 0 0 3px var(--sel),0 0 10px var(--sel)}50%{box-shadow:0 0 0 4px var(--sel),0 0 22px var(--sel)}}
@media (max-width:700px){
  .tut{position:fixed;top:auto;bottom:0;left:0;right:0;margin:0;border-radius:12px 12px 0 0;max-height:42vh;overflow:auto;border-left-width:1px;border-top:5px solid var(--sel);padding-bottom:calc(12px + env(safe-area-inset-bottom,0px))}
  body.tut-on{padding-bottom:44vh}
  .tut .step{margin-left:0;width:100%}
}
button.ghost{background:transparent}
.rules{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:20;overflow:auto;padding:16px;padding-top:calc(16px + env(safe-area-inset-top,0px))}
.rules .sheet{background:var(--panel);color:var(--ink);max-width:840px;margin:0 auto;border-radius:10px;padding:18px 20px 24px;border:1px solid var(--line)}
.rules .sh{display:flex;align-items:baseline;gap:12px;position:sticky;top:-18px;background:var(--panel);padding:6px 0;margin:-6px 0 4px;z-index:1}
.rules .sh .spacer{flex:1}
.rules h2{margin-top:18px;border-bottom:1px solid var(--line);padding-bottom:4px}
.rules h3{margin-top:12px;color:var(--ink)}
.rules p,.rules li{font-size:14px}
.rules ul{padding-left:20px;margin:6px 0}
.rules table{width:100%;border-collapse:collapse;font-size:13px;margin-top:6px}
.rules td,.rules th{text-align:left;padding:5px 6px;border-bottom:1px solid var(--line);vertical-align:top}
.rules th{font-family:"Barlow Condensed";font-size:14px;color:var(--muted)}
.rules td.k{white-space:nowrap;font-weight:600}
@media (prefers-reduced-motion:reduce){*{transition:none!important}.tut-target{animation:none}}
</style>

<script>
/* ============ ENGINE ============ */
function rng(seed){let s=seed>>>0;return()=>{s=(s*1664525+1013904223)>>>0;return s/4294967296;}}
function shuffle(a,r){for(let i=a.length-1;i>0;i--){const j=Math.floor(r()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function clone(o){return JSON.parse(JSON.stringify(o));}

function newGame(seats,seed,script){
  const r=rng(seed);
  const two=false;
  const workers={};

  if(def.icon==="any"&&!ic){g.pending=[{type:"icon",issue:iid}];return null;}
  if(winsLeft(g)<=0)return "All three Small Win slots are used.";
  const needN=iid==="wild"?reqN(g)+1:reqN(g);
  if(onBoard(g).filter(w=>w.disp>=3&&w.issues.includes(ic)).length<needN)return `Requirement not met: ${needN} Signed or Steward workers with that icon.`;
  const cost=g.fear>=8?2:1; if(o.actions<cost)return `A Small Win costs ${cost} right now.`;
  spend(g,o,cost); is.state="done"; g.won=g.won||{}; g.won[iid]=true; if(ic==="Pay"||ic==="Crunch")unlockIcon(g,ic);
  const ups=onBoard(g).filter(w=>w.issues.includes(ic)&&w.disp<3); ups.forEach(w=>{moveUp(g,w);});
  let f=-1; if(iid==="harass")f=-2; if(g.orgs.some(x=>x.k==="cm"&&hasAbility(g,x)))f-=1; addFear(g,f);
  if(iid==="layoffs")g.flags.contractImmune=true;
  if(iid==="wild"){g.orgs.forEach(x=>x.burnout=Math.max(0,x.burnout-1)); unlockIcon(g,"Pay"); unlockIcon(g,"Crunch");}
  { const slot=g.round<g.row.length?g.row[g.round]:(g.row[g.round]={cards:[],issues:[]}); slot.issues.push(iid); }
  logit(g,`Small Win: ${def.n}. ${ups.length} worker${ups.length===1?"":"s"} move up. Fear ${f}. Management draws +1 next round. ${def.x}`); return null; }
function doCommittee(g,oi,wid){ const o=g.orgs[oi]; const w=g.workers[wid]; if(!w.onBoard||!w.leader||w.disp!==3)return "Pick a Signed Leader (★).";
  if(o.actions<2)return "Build Committee costs 2 actions."; spend(g,o,2); w.disp=4; logit(g,`${w.name} becomes a Steward.`); return null; }
const REASSURE={cost:1,perOrg:9,perTable:true};
function doReassure(g,oi){ const o=g.orgs[oi]; const free=o.k==="ap"&&hasAbility(g,o)&&!o.apFree; if(g.fear<=0)return "Fear is already 0.";
  if(REASSURE.perTable&&g.reassuredRound&&!free)return "Once per round for the whole committee.";
  if((o.reassured||0)>=REASSURE.perOrg&&!free)return "Once per round.";
  if(!free&&o.actions<REASSURE.cost)return `Reassure costs ${REASSURE.cost}.`;
  if(free)o.apFree=true; else {spend(g,o,REASSURE.cost); o.reassured=(o.reassured||0)+1; g.reassuredRound=true;} addFear(g,-1); logit(g,`${o.n} steadies the room. Fear ${g.fear}.`); return null; }
function doReset(g,oi){ const o=g.orgs[oi]; if(o.actions<1)return "No actions left."; if(o.burnout===0)return "No Burnout to remove."; spend(g,o,1); o.burnout--; logit(g,`${o.n} rests. Burnout ${o.burnout}.`); return null; }
function doOverwork(g,oi){ const o=g.orgs[oi]; if(o.overworked)return "Once per round."; if(o.burnout>=3)return "Already burned out."; o.overworked=true; if(!won(g,"crunch"))addBurnout(g,o,1,false); o.actions++; o.turnTotal=(o.turnTotal||0)+1; logit(g,`${o.n} overworks. Burnout ${o.burnout}.`); return null; }
function doEnd(g,oi){ const o=g.orgs[oi]; o.done=true; logit(g,`${o.n} ends their turn.`); g.cur=(g.cur+1)%g.orgs.length; return null; }
function doInfluencePick(g,wid){ const p=g.pending&&g.pending[0]; if(!p||p.type!=="influence")return "Nothing to choose."; const w=g.workers[wid];
  if(!w.onBoard||w.dept!==p.dept||w.disp>=3||immovable(w)||(w.disp===2&&locked(g,w)))return "Pick a movable worker in that department below Signed (holdouts stop at Leaning).";
  moveUp(g,w); logit(g,`${p.from}'s influence moves ${w.name} to ${DISP[w.disp]}.`); p.n--; if(p.n<=0||!onBoard(g,p.dept).some(x=>x.disp<3&&!immovable(x)&&!(x.disp===2&&locked(g,x))))g.pending.shift();
  g.pending.sort((a,b)=>(a.type==="influence"?0:1)-(b.type==="influence"?0:1)); cleanPending(g); if(g.phase==="steward"&&!g.pending.length)finishRoundStart(g); return null; }

function afterAction(g){ if(g.phase!=="org")return; cleanPending(g); if(g.pending&&g.pending.length)return; if(checkLoss(g))return; skipDone(g); }

 {k:"mgmt",h:"Management moves first",when:g=>g.round===1&&g.phase==="org",t:"Every round starts with management playing a card (more as you grow, and after each Small Win). The Management panel below the board shows what was played. Then you act: 3 actions per organizer, minus Burnout."},
 {k:"influence",h:"Influence: choose who they bring along",when:g=>g.pending&&g.pending.some(p=>p.type==="influence"),t:"A worker who signs pulls colleagues in their department up one step, as many as their influence dots. Click the highlighted workers on the board, or skip the rest."},
 {k:"absorb",h:"A Steward can absorb this card",when:g=>g.phase==="absorb",t:"Each Steward can absorb one management card per game, cancelling its effect in their department. Tick the Stewards allowed to spend it if this card hits them, then resolve. Save it for the cards that hurt."},
 {k:"stewardphase",h:"Steward phase",when:g=>g.phase==="steward",t:"At the start of each round, every Steward brings one worker in their department up a step. Click a highlighted worker, or make no move."},
 {k:"holdout",h:"Holdouts",when:g=>onBoard(g).some(w=>locked(g,w)),t:"A worker with a lock will not sign until the Issue they care about is won (Pay Transparency or End Crunch). One-on-Ones take them to Leaning and stop. Win the Issue and they all move up at once."},
 {k:"plant",h:"A Plant took the empty desk",when:g=>onBoard(g).some(w=>w.reserve),t:"Whenever a worker is removed from the board, management fills the desk with a Plant: Hostile, immovable, and every One-on-One in that department costs +1 while it sits there."},
 {k:"fear7",h:"Fear is 7 or higher",when:g=>g.fear>=7,t:"One-on-Ones now cost 2, and every organizer takes +1 Burnout at the end of the round. Reassure (Fear −1, once per round) or win a Small Win to bring it down. At 10 the drive collapses."},
 {k:"burnout",h:"Burnout",when:g=>g.orgs.some(o=>o.burnout>0),t:"Burnout 1 and 2 still give 3 and 2 actions; at 3 an organizer has 1 action and loses their ability. Reset costs an action and removes one Burnout. If every organizer burns out, the drive is over."},
 {k:"smallwin",h:"Small Win: now management reacts",when:g=>g.issues.some(i=>i.state==="done"),t:"Each Issue you win changes a rule for the rest of the game, moves every worker with its icon up, and lowers Fear. It also adds a card to management's next draw. Three Small Wins per game."},
];
let lastTutStep=-1;
function seen(k,v){ return ls("cc_seen_"+k,v); }
function renderGuide(root,g){
  if(g.phase==="over")return;
  const grid=root.querySelector(".grid");
  if(g.tutorial&&!g.tutorial.done){
    tutorialAdvance(g); if(g.local)ls("cc_local",JSON.stringify(g));
    if(g.tutorial.done)return;
    const st=TUT[g.tutorial.step];
    const card=$(`<div class="tut"><div class="th"><h2>${st.h}</h2><span class="step">step ${g.tutorial.step+1} of ${TUT.length}</span></div>${st.t?`<p>${st.t}</p>`:""}
      <div class="row">${st.next?`<button class="primary" data-always onclick="tutorialNext()">${g.tutorial.step===TUT.length-1?"Finish the tutorial":"Next"}</button>`:`<span class="small" style="margin-left:0">Do the highlighted action to continue.</span>`}<button class="ghost" data-always onclick="tutorialSkip()">Skip tutorial</button></div></div>`);
    root.insertBefore(card,grid);
    gate(root,st);
    document.body.classList.add("tut-on");
    if(lastTutStep!==g.tutorial.step){ lastTutStep=g.tutorial.step; const t=root.querySelector(".tut-target,.tut-spot"); if(t&&t.scrollIntoView){ const r=t.getBoundingClientRect(); const lim=window.innerWidth<=700?window.innerHeight*0.55:window.innerHeight; if(r.top<0||r.bottom>lim)t.scrollIntoView({block:"center",behavior:"smooth"}); } }
    return;
  }
  document.body.classList.remove("tut-on");
  const c=CALLOUTS.find(c=>!seen(c.k)&&c.when(g));
  if(!c)return;
  const card=$(`<div class="callout"><h2>${c.h}</h2><p>${c.t}</p><div class="row"><button class="primary" data-always>Got it</button><span class="small">Shown once, the first time it happens.</span></div></div>`);
  card.querySelector("button").onclick=()=>{ seen(c.k,"1"); render(); };
  root.insertBefore(card,grid);
}
/* rules reference, generated from the same tables the engine plays by */
function openRules(){
  if(document.querySelector(".rules"))return;
  const tier=t=>MGMT.filter(m=>m[1]===t).map(m=>`<tr><td class="k">${esc(m[2])}</td><td>${esc(m[3])}</td></tr>`).join("");
  const el=$(`<div class="rules" role="dialog" aria-label="Rules"><div class="sheet">
    <div class="sh"><h1 style="font-size:28px">Card Check: the rules</h1><span class="spacer"></span><button class="primary" id="rclose">Close</button></div>
    <p>A cooperative game for 1 to 6 organizers running a union drive inside a game studio. Everyone wins or loses together.</p>
    <h2>The goal</h2>
    <p>Get a majority of the 32 workers to <b>Signed</b> or <b>Steward</b> before the vote at the end of round 8: <b>21</b> with one to three organizers, <b>24</b> with four or more. You lose at once if every organizer burns out, and at the end of any round where Fear is 10.</p>
    <h2>The board</h2>
    <p>Four departments (Engineering, Art, QA, Production), eight workers each. Workers start face down in their department pile; Map reveals them. Every worker has a disposition: <b>Hostile, Undecided, Leaning, Signed, Steward</b>.</p>
    <ul><li><b>Dots</b> are influence. When a worker reaches Signed, you move up to that many colleagues in their department up one step.</li>
    <li><b>★</b> marks a Leader. Only Signed Leaders can become Stewards. A <b>Hostile</b> Leader drags one worker in their department down a step every round.</li>
    <li><b>Issues</b> on the card (Pay, Crunch, Layoffs, Credit, Harassment) are what the worker cares about. A worker with no issues is immovable.</li>
    <li><b>🔒 Holdouts</b> stop at Leaning until the matching Issue (Pay Transparency or End Crunch) is won.</li>
    <li><b>Contract</b> workers can be removed by Contract Ends. A removed worker's desk is filled by a <b>Plant</b>: Hostile, immovable, and +1 to every One-on-One in that department.</li></ul>
    <h2>A round</h2>
    <ol style="padding-left:20px"><li><b>Management</b> draws and resolves cards: 1 per round, +1 from round 7, +1 at 12 and again at 20 Signed, +1 for each Small Win you took last round. Tier 1 cards in rounds 1 to 3, tier 2 from round 4, tier 3 from round 7. Before an absorbable card resolves, you choose which Stewards may spend their absorb on it.</li>
    <li><b>Stewards</b> each bring one worker in their department up a step.</li>
    <li><b>Hostile Leaders</b> each drag one worker down.</li>
    <li><b>Organizers</b> take turns spending actions. First player rotates each round.</li>
    <li><b>Status check.</b> Fear 10: the drive collapses. Fear 7 to 9: every organizer takes +1 Burnout. After round 8, the vote.</li></ol>
    <h2>Actions</h2>
    <table><tr><th>Action</th><th>Cost</th><th>Effect</th></tr>
    <tr><td class="k">Map</td><td>1 in your home department. 2 elsewhere, or 1 once someone there is Signed.</td><td>Reveal the top worker of a department pile.</td></tr>
    <tr><td class="k">One-on-One</td><td>1. 2 when Fear is 7+, under a Union Avoidance Consultant, or after a Town Hall. +1 per Plant in the department. 0 once per round in a department with a Steward.</td><td>Move a revealed worker up one step.</td></tr>
    <tr><td class="k">Small Win</td><td>1. 2 when Fear is 8+.</td><td>Resolve an Issue whose requirement is met: 3 Signed or Steward workers sharing its icon (4 for Just Cause). Every worker with that icon moves up a step, Fear −1, its rule applies for the rest of the game, and management draws +1 next round. Three per game.</td></tr>
    <tr><td class="k">Build Committee</td><td>2</td><td>A Signed Leader becomes a Steward.</td></tr>
    <tr><td class="k">Reassure</td><td>1, once per round for the committee</td><td>Fear −1.</td></tr>
    <tr><td class="k">Reset</td><td>1</td><td>Remove one Burnout from yourself.</td></tr>
    <tr><td class="k">Overwork</td><td>+1 Burnout, once per round (free once End Crunch is won)</td><td>+1 action this round.</td></tr></table>
    <h2>Fear and Burnout</h2>
    <p><b>Fear</b> starts at 3. Management cards raise it; Reassure and Small Wins lower it. At 7, One-on-Ones cost 2 and everyone takes Burnout at round end. At 8, Small Wins cost 2. At 10, you lose at the status check.</p>
    <p><b>Burnout</b> per organizer: 0 or 1 gives 3 actions, 2 gives 2 actions, 3 gives 1 action and no ability. All organizers at 3 is a loss.</p>
    <h2>Stewards</h2>
    <p>A Steward gives one free One-on-One in their department per round, brings one worker up at the start of each round, and can <b>absorb</b> one management card per game to cancel its effect in their department. Stewards cannot be moved down.</p>
    <h2>Organizers</h2>
    <table>${ORGS.map(o=>`<tr><td class="k">${esc(o.n)}</td><td>${DEPTS[o.d][0]}</td><td>${esc(o.a)}</td></tr>`).join("")}</table>
    <h2>Issues</h2>
    <table>${ISSUES.map(i=>`<tr><td class="k">${esc(i.n)}</td><td>${i.icon==="any"?"4 sharing any one icon":"3 with "+i.icon}</td><td>${esc(i.x)}</td></tr>`).join("")}</table>
    <h2>Management cards</h2>
    <h3>Tier 1 (rounds 1 to 3)</h3><table>${tier(1)}</table>
    <h3>Tier 2 (from round 4)</h3><table>${tier(2)}</table>
    <h3>Tier 3 (from round 7)</h3><table>${tier(3)}</table>
    <h2>Symbols</h2>
    <p>● influence · ★ Leader · 🔒 holdout · ⛨ Steward absorb ready · ⊘ absorb spent · ⟲ department reorganized this round · ✕ department decertified</p>
    <div class="row" style="margin-top:16px"><button class="primary" id="rclose2">Close</button></div>
  </div></div>`);
  const close=()=>{el.remove();document.removeEventListener("keydown",onk);};
  const onk=e=>{if(e.key==="Escape")close();};
  el.querySelector("#rclose").onclick=close; el.querySelector("#rclose2").onclick=close;
  el.addEventListener("click",e=>{if(e.target===el)close();});
  document.addEventListener("keydown",onk);
  document.body.appendChild(el);
}
function arm(a){armed=armed===a?null:a;render();}
async function act(fn){ const g=clone(G); const err=fn(g); if(err){toast(err);return;} armed=null; afterAction(g); await write(g); }
window.addEventListener("hashchange",()=>{const h=location.hash.replace("#","").toUpperCase(); if(h&&h!==code&&/^[A-Z0-9]{5}$/.test(h)&&!offline)join(h);});
init();
</script>
</body>
