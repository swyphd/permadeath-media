<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>Card Check — Playtest · Permadeath Media</title>
<meta name="description" content="Card Check: a cooperative card game about running a union drive inside a game studio. Online playtest build from Permadeath Media.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;1,400&display=swap" rel="stylesheet">
<style>
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
  --bg:#eef0f3;--panel:#ffffff;--ink:#1c2230;--muted:#5f6b7c;--line:#d3d8e0;--soft:#f6f7f9;
  --eng:#2b6cb0;--art:#b83280;--qa:#2f855a;--prod:#c05621;
  --red:#b7312c;--amber:#b7791f;--ok:#2f855a;--accent:#1f3b6e;--accent-ink:#ffffff;
  --hostile:#fff1f0;--undecided:#f7f8fa;--leaning:#eef5fc;--signed:#edf8f0;--steward:#e3f3e8;
  --sel:#f6c34c;--sel-ink:#1c2230;
  color-scheme:light dark;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#161a22;--panel:#1f2430;--ink:#e8ebf0;--muted:#9aa5b5;--line:#343b48;--soft:#262c38;
  --hostile:#3a2422;--undecided:#262c38;--leaning:#1f2d40;--signed:#1f3328;--steward:#20402b;
  --accent:#6f9ae0;--accent-ink:#0f1420;--sel:#e0b23a;--sel-ink:#1c2230;
  --red:#f28b84;--amber:#e8bc5a;--ok:#6fd49a;
}}
:root[data-theme="dark"]{
  --bg:#161a22;--panel:#1f2430;--ink:#e8ebf0;--muted:#9aa5b5;--line:#343b48;--soft:#262c38;
  --hostile:#3a2422;--undecided:#262c38;--leaning:#1f2d40;--signed:#1f3328;--steward:#20402b;
  --accent:#6f9ae0;--accent-ink:#0f1420;--sel:#e0b23a;--sel-ink:#1c2230;
  --red:#f28b84;--amber:#e8bc5a;--ok:#6fd49a;
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 "IBM Plex Sans",system-ui,sans-serif}
h1,h2,h3{font-family:"Barlow Condensed","IBM Plex Sans",sans-serif;font-weight:700;letter-spacing:.01em;margin:0}
h1{font-size:34px;line-height:1}
h2{font-size:20px}
h3{font-size:16px;color:var(--muted);font-weight:600}
button{font:inherit;color:inherit;background:var(--soft);border:1px solid var(--line);border-radius:6px;padding:7px 12px;cursor:pointer}
button:hover{border-color:var(--accent)}
button:focus-visible{outline:3px solid var(--sel);outline-offset:1px}
button:disabled{opacity:.45;cursor:default}
button.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:600}
button.armed{background:var(--sel);color:var(--sel-ink);border-color:var(--sel);font-weight:600}
input{font:inherit;padding:8px 10px;border:1px solid var(--line);border-radius:6px;background:var(--panel);color:var(--ink)}
.wrap{max-width:1360px;margin:0 auto;padding:14px}
.credit a{color:var(--accent);font-weight:600}
.credit{max-width:1360px;margin:0 auto;padding:4px 14px 20px;font-size:12px;color:var(--muted)}
/* mailing list */
.signup{max-width:1360px;margin:0 auto;padding:0 14px}
.signup .box{border:1px solid var(--line);border-radius:10px;background:var(--panel);padding:12px 14px;display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center}
.signup .txt{flex:1 1 260px;min-width:0}
.signup h3{color:var(--ink);font-family:"Barlow Condensed","IBM Plex Sans",sans-serif;font-size:18px;font-weight:700}
.signup p{margin:2px 0 0;font-size:13px;color:var(--muted)}
.signup form{display:flex;flex-wrap:wrap;gap:8px;flex:1 1 300px;align-items:center}
.signup input[type=email]{flex:1 1 180px;min-width:0}
.signup .hp{position:absolute;left:-9999px;width:1px;height:1px;opacity:0}
.signup .msg{flex:1 1 100%;font-size:13px;color:var(--muted);min-height:1.2em;margin:0}
.signup .msg.ok{color:var(--ok)}
.signup .msg.err{color:var(--red)}
.signup .sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.top{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap;margin-bottom:12px}
.top .sub{color:var(--muted)}
.top .spacer{flex:1}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px}
.grid{display:grid;grid-template-columns:260px 1fr 300px;gap:12px;align-items:start}
@media (max-width:1050px){.grid{grid-template-columns:1fr}.side{order:2}.board-wrap{order:1}.right{order:3}}
.stack>*+*{margin-top:12px}

/* lobby */
.lobby{max-width:720px;margin:30px auto}
.lobby .row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.seats{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px;margin-top:10px}
.seat{border:1px solid var(--line);border-radius:8px;padding:10px;background:var(--soft);cursor:pointer}
.seat.mine{border-color:var(--accent);box-shadow:inset 0 0 0 2px var(--accent)}
.seat.taken{opacity:.6;cursor:default}
.seat b{display:block;font-family:"Barlow Condensed";font-size:18px}
.seat small{color:var(--muted);display:block}
.code{font-family:"Barlow Condensed";font-size:28px;letter-spacing:.12em}

/* board */
.board{display:grid;grid-template-columns:28px 86px repeat(5,1fr);gap:4px}
.board .hdr{text-align:center;font-family:"Barlow Condensed";font-weight:700;font-size:15px;padding:4px 0;color:var(--muted)}
.board .hdr.hostile{color:var(--red)}
.cell{min-height:92px;border-radius:6px;padding:4px;display:flex;flex-wrap:wrap;gap:4px;align-content:flex-start}
.cell.c0{background:var(--hostile)}.cell.c1{background:var(--undecided)}.cell.c2{background:var(--leaning)}.cell.c3{background:var(--signed)}.cell.c4{background:var(--steward)}
.deptlab{writing-mode:vertical-rl;transform:rotate(180deg);color:#fff;font-family:"Barlow Condensed";font-weight:700;font-size:13px;border-radius:5px;display:flex;align-items:center;justify-content:center;letter-spacing:.06em}
.pile{border:1.5px dashed var(--line);border-radius:6px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:12px;color:var(--muted);cursor:pointer;padding:4px;gap:2px}
.pile.ok{border-color:var(--accent);color:var(--ink);background:var(--soft)}
.pile .n{font-family:"Barlow Condensed";font-size:22px;font-weight:700;line-height:1}
.pile.inoc{box-shadow:inset 0 0 0 2px var(--amber)}
.wk{background:var(--panel);border:1px solid var(--line);border-radius:5px;padding:4px 6px;font-size:12px;line-height:1.2;width:100%;height:52px;cursor:default;position:relative;display:flex;flex-direction:column;justify-content:space-between;overflow:hidden}
.wk b{display:flex;align-items:center;gap:3px;font-size:13px;white-space:nowrap;overflow:hidden}
.wk b .nm{overflow:hidden;text-overflow:ellipsis;min-width:0}
.wk b .st{flex:none;font-size:12px}
.wk .r{display:block;color:var(--muted);font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.wk .i{display:block;font-size:10.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.wk .inf{flex:none;font-size:10px;letter-spacing:1px;margin-left:auto;color:var(--ink)}
.wk.sel{cursor:pointer;box-shadow:0 0 0 2px var(--sel)}
.wk.inoc{transform:rotate(-6deg);border-color:var(--amber);box-shadow:0 0 0 1.5px var(--amber)}

@media (max-width:700px){.board{grid-template-columns:22px 26px repeat(5,1fr)}.wk{width:100%;min-width:0}.wk .r,.wk .i,.wk .inf{display:none}.wk b{font-size:11px}.wk{padding:3px 4px;height:30px;justify-content:center}.board .hdr{font-size:11px}.pile{font-size:10px}.pile .n{font-size:16px}.deptlab{font-size:10px}}

/* organizers */
.org{border:1px solid var(--line);border-radius:8px;padding:8px 10px;background:var(--soft)}
.org.active{border-color:var(--accent);box-shadow:inset 0 0 0 2px var(--accent)}
.org .nm{font-family:"Barlow Condensed";font-weight:700;font-size:18px;display:flex;justify-content:space-between;align-items:baseline}
.org .nm small{font-family:"IBM Plex Sans";font-weight:500;font-size:12px;color:var(--muted)}
.org .ab{font-size:12px;color:var(--muted)}
.org .ab.lost{text-decoration:line-through}
.burn{display:inline-block;width:14px;height:20px;border:1.5px solid var(--ink);border-radius:2px;vertical-align:middle;margin-right:6px;transition:transform .25s}
.burn.b1{transform:rotate(90deg)}.burn.b2{transform:rotate(180deg)}.burn.b3{background:var(--ink)}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:8px}
.actions button{padding:7px 6px;font-size:13px}
.hint{font-size:13px;color:var(--muted);margin-top:8px;min-height:1.4em}
.hint.warn{color:var(--red)}
.prompt{background:var(--sel);color:var(--sel-ink);padding:8px 10px;border-radius:6px;font-weight:600;margin-top:8px}

/* fear */
.fear{display:flex;align-items:center;gap:10px}
.fear .dial{width:92px;height:92px;flex:none}
.fear .num{font-family:"Barlow Condensed";font-size:44px;font-weight:700;line-height:1}
.fear .lab{color:var(--muted);font-size:13px}
.fearnotes{font-size:12px;color:var(--muted)}

/* issues */
.issue{border:1px solid var(--line);border-radius:6px;padding:6px 8px;font-size:13px;display:flex;justify-content:space-between;align-items:center;gap:6px}
.issue.ready{border-color:var(--ok)}
.issue.done{opacity:.5}
.issue.gone{opacity:.4;text-decoration:line-through}
.issue b{display:block}
.issue small{color:var(--muted)}
.issue .req{font-family:"Barlow Condensed";font-size:18px;font-weight:700;white-space:nowrap}

/* management row */
.mrow{display:grid;grid-template-columns:repeat(9,1fr);gap:6px}
.slot{border:1.5px dashed var(--line);border-radius:6px;min-height:64px;padding:4px;font-size:11px;text-align:center;color:var(--muted);position:relative}
.slot.filled{border-style:solid;background:var(--soft);color:var(--ink)}
.slot.now{border-color:var(--accent);border-style:solid}
.slot .n{font-family:"Barlow Condensed";font-weight:700;font-size:14px}
.slot .cards{font-size:10px;line-height:1.2}
.slot .iss{display:inline-block;width:10px;height:7px;background:#e9d27a;border:1px solid #9a7a1a;border-radius:1px;margin:1px}
.mcards{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:8px;margin-top:10px}
.mcard{border-left:4px solid var(--line);padding:8px 12px;background:var(--soft);border-radius:4px;font-size:13px}
.mcard .tier{font-size:11px;color:var(--muted);letter-spacing:.04em}
.mcard.t1 .tier{color:#718096}.mcard.t2 .tier{color:#c05621}.mcard.t3 .tier{color:#9b2c2c}
.mpanel .mhead{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
.mpanel .mhead .spacer{flex:1}
@media (max-width:700px){.mrow{grid-template-columns:repeat(9,1fr);gap:3px}.slot{min-height:44px;font-size:9px;padding:2px}.slot .cards{display:none}}
.mcard.t1{border-left-color:#718096}.mcard.t2{border-left-color:#c05621}.mcard.t3{border-left-color:#9b2c2c}
.mcard b{font-family:"Barlow Condensed";font-size:17px}
.mcard .how{color:var(--muted);font-size:12px}
.log{font-size:12px;max-height:240px;overflow:auto;border-top:1px solid var(--line);padding-top:6px}
.log div{padding:2px 0;border-bottom:1px dotted var(--line)}
.log .r{font-weight:600;color:var(--accent);margin-top:4px}
.banner{padding:14px;border-radius:8px;font-family:"Barlow Condensed";font-size:26px;text-align:center}
.banner.win{background:var(--signed);color:var(--ok)}
.banner.loss{background:var(--hostile);color:var(--red)}
.small{font-size:12px;color:var(--muted)}
.phase{font-family:"Barlow Condensed";font-weight:700;font-size:22px}
.toast{position:fixed;left:50%;bottom:calc(16px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:8px 14px;border-radius:8px;font-size:13px;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.show{opacity:1}
/* tutorial, callouts, rules */
.tut,.callout{position:sticky;top:0;z-index:5;background:var(--panel);border:1px solid var(--line);border-left:5px solid var(--sel);border-radius:10px;padding:12px 14px;margin-bottom:12px;box-shadow:0 4px 14px rgba(0,0,0,.14)}
.callout{border-left-color:var(--accent)}
.tut .th{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.tut h2,.callout h2{font-size:20px}
.tut .step{font-size:12px;color:var(--muted);margin-left:auto;white-space:nowrap}
.tprog{display:flex;align-items:center;gap:4px;margin-bottom:8px;flex-wrap:wrap}
.tprog .seg{flex:1 1 36px;max-width:64px;height:6px;border-radius:3px;background:var(--line)}
.tprog .seg.done{background:var(--ok)}
.tprog .seg.now{background:var(--sel)}
.tprog .plab{font-family:"Barlow Condensed";font-weight:700;font-size:14px;letter-spacing:.03em;margin-left:8px;white-space:nowrap}
.tut p,.callout p{margin:6px 0 0;font-size:14px;max-width:72ch}
.tut .row,.callout .row{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap;align-items:center}
.tut .row .small{margin-left:auto}
.tut-target{box-shadow:0 0 0 3px var(--sel),0 0 16px var(--sel)!important;position:relative;z-index:1;animation:tutpulse 1.2s ease-in-out infinite}
button.tut-target{border-color:var(--sel)}
.tut-spot{outline:3px solid var(--sel);outline-offset:3px;border-radius:8px}
@keyframes tutpulse{0%,100%{box-shadow:0 0 0 3px var(--sel),0 0 10px var(--sel)}50%{box-shadow:0 0 0 4px var(--sel),0 0 22px var(--sel)}}
@media (max-width:700px){
  .tut{position:fixed;top:auto;bottom:0;left:0;right:0;margin:0;border-radius:12px 12px 0 0;max-height:42vh;overflow:auto;border-left-width:1px;border-top:5px solid var(--sel);padding-bottom:calc(12px + env(safe-area-inset-bottom,0px))}
  body.tut-on{padding-bottom:44vh}
  .tut .step{margin-left:auto;margin-top:4px}
  .tprog .seg{flex:1 1 40px;max-width:none}
  .tprog .plab{flex:1;margin:4px 0 0}
}
button.ghost{background:transparent}
.rules{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:20;overflow:auto;padding:16px;padding-top:calc(16px + env(safe-area-inset-top,0px))}
.rules .sheet{background:var(--panel);color:var(--ink);max-width:840px;margin:0 auto;border-radius:10px;padding:18px 20px 24px;border:1px solid var(--line)}
.rules .sh{display:flex;align-items:baseline;gap:12px;position:sticky;top:-18px;background:var(--panel);padding:6px 0;margin:-6px 0 4px;z-index:1}
.rules .sh .spacer{flex:1}
.rules h2{margin-top:18px;border-bottom:1px solid var(--line);padding-bottom:4px}
.rules h3{margin-top:12px;color:var(--ink)}
.rules p,.rules li{font-size:14px}
.rules ul{padding-left:20px;margin:6px 0}
.rules table{width:100%;border-collapse:collapse;font-size:13px;margin-top:6px}
.rules td,.rules th{text-align:left;padding:5px 6px;border-bottom:1px solid var(--line);vertical-align:top}
.rules th{font-family:"Barlow Condensed";font-size:14px;color:var(--muted)}
.rules td.k{white-space:nowrap;font-weight:600}
@media (prefers-reduced-motion:reduce){*{transition:none!important}.tut-target{animation:none}}
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<div class="signup" id="signup">
  <div class="box">
    <div class="txt">
      <h3>Hear when Card Check changes</h3>

      <button class="primary" type="submit">Sign up</button>

    </form>
  </div>
</div>
<p class="credit">Card Check is a <a href="/">Permadeath Media</a> playtest build. Rules and cards are subject to change.</p>
<div class="toast" id="toast"></div>
<script type="module">

const FIREBASE_CONFIG={apiKey:"AIzaSyCam5Zmp9Aa8JYy3fcA7xqJQ3WKfIsc7qQ",authDomain:"card-check-12453.firebaseapp.com",projectId:"card-check-12453",appId:"1:787538877518:web:9c89e5cdc48d145475b71f"};
const GAME_TTL_DAYS=7;
function loadScript(src){return new Promise((res,rej)=>{const e=document.createElement("script");e.src=src;e.onload=res;e.onerror=()=>rej(new Error("failed to load "+src));document.head.appendChild(e);});}

let db=null,authId=null,myId=null,code=null,G=null,unsub=null,armed=null,offline=false;
const app=document.getElementById("app");
const HOME=`<button class="ghost" data-always data-act="rules" onclick="openRules()">Rules</button>`;

/* ---- play analytics (kit/analytics.js -> /api/events) ----
   One run per game, with its id kept on the game (g.run) so a reload or a second
   device carries on the same run. Online, the device whose move changed the game
   reports it, so a table counts once. Anonymous, and silent under Do Not Track. */
const BUILD="2026-10-13";
const stats=createAnalytics({game:"card-check",version:BUILD});
stats.progress(()=>G&&G.run&&G.orgs?{round:G.round,signed:signedCount(G),fear:G.fear}:null);

// Compares the game before and after this device's move and reports what changed.
function record(prev,g){
  if(!g||!g.run||!g.orgs)return;
  try{
    const started=!prev||!prev.orgs||prev.run!==g.run;
    if(stats.run!==g.run){
      if(started){ stats.runStart({mode:modeOf(g),organizers:g.orgs.length},{id:g.run}); g.orgs.forEach(o=>stats.choice("organizer",o.k)); }
      else stats.runStart({mode:modeOf(g),round:g.round},{resume:g.run});
    }
    if(started)return;
    if(g.round>prev.round)stats.milestone("round_"+g.round,{round:g.round,signed:signedCount(g),fear:g.fear});
    if(!signedCount(prev)&&signedCount(g))stats.milestone("first_signed",{round:g.round});
    if(!onBoard(prev).some(w=>w.disp===4)&&onBoard(g).some(w=>w.disp===4))stats.milestone("first_steward",{round:g.round});
    g.issues.forEach(i=>{ const was=prev.issues.find(x=>x.id===i.id); if(i.state==="done"&&was&&was.state!=="done"){ stats.milestone("small_win",{round:g.round,issue:i.id}); stats.choice("small_win",i.id,{round:g.round}); } });
    if(g.phase==="over"&&prev.phase!=="over")stats.runEnd(g.result,{round:g.round,signed:voteCount(g),needed:g.threshold,fear:g.fear,ended_by:endedBy(g)});
  }catch(e){ console.warn("Card Check: analytics",e); }
}
// The guided game's goals, as milestones; skipping it is a choice worth counting.
function recordTutorial(before,after){
  try{
    const steps=guide.steps;
    for(let i=before.index||0;i<(after.index||0)&&i<steps.length;i++) if(!steps[i].next)stats.milestone("tutorial_"+steps[i].id,{round:G&&G.round});
    if(after.status==="skipped"&&before.status!=="skipped")stats.choice("tutorial","skip",{at:(steps[after.index]||{}).id||null});
    if(after.status==="done"&&before.status!=="done")stats.milestone("tutorial_done");
  }catch(e){}
}

        e.title=`${w.name} — ${w.role}${w.contract?" (contract)":""}\n${w.leader?"Leader. ":""}Influence ${infl(g,w)}${infl(g,w)!==w.infl?" (Credit Policy)":""}.\nIssues: ${w.reserve?"none — a management Plant. Immovable; every One-on-One in this department costs +1.":(w.issues.join(", ")||"none — immovable: no grievance, no leverage")}.\nDisposition: ${DISP[w.disp]}.${w.trait?`\n${w.trait}`:""}${w.lock?(locked(g,w)?`\nHoldout: won't sign until ${w.lock==="Pay"?"Pay Transparency":"End Crunch"} is won.`:"\nFormer holdout, now willing to sign."):""}${w.disp===4?(w.absorbUsed?"\nSteward; absorb spent.":"\nSteward; one absorb available.")+(w.freeUsed?" Free One-on-One used this round.":" Free One-on-One available this round."):""}`;
        if(sel)e.onclick=()=>{ if(pend&&pend.type==="steward")act(g=>doStewardPick(g,w.id)); else if(pend)act(g=>doInfluencePick(g,w.id)); else if(armed==="one")act(g=>doOne(g,g.cur,w.id)); else if(armed==="com")act(g=>doCommittee(g,g.cur,w.id)); };
        c.appendChild(e);
      });
      b.appendChild(c);
    }
  });
  el.appendChild(b);
  el.appendChild($(`<div class="small" style="margin-top:6px">● influence · ★ leader (a Hostile ★ pulls one worker down each round) · ⚑ special rule (hover or tap the card) · 🔒 holdout: stops at Leaning until their demand is won · ⛨ Steward absorb ready · ⊘ absorb spent · ⟲ reorganized this round · ✕ decertified</div>`));
}
function renderMgmt(el,g){
  const n=signedCount(g); const nextDraw=1+(g.round+1>=7?1:0)+(n>=12?1:0)+(n>=20?1:0)+((g.row[g.round]&&g.row[g.round].issues.length)||0);
  el.appendChild($(`<div class="mhead"><h2>Management</h2><span class="small">Tier ${tierFor(g)} now · ${(g.deck[tierFor(g)]||[]).length} left in it, ${deckLeft(g)} in all</span><span class="spacer"></span><span class="small">${g.phase==="over"?"":`next round draws <b>${nextDraw}</b> card${nextDraw===1?"":"s"}`}</span></div>`));
  const row=$(`<div class="mrow"></div>`);
  for(let i=0;i<9;i++){ const s=g.row[i]; const filled=s&&s.cards.length; const now=i===g.round-1;
    const label=i===7?"vote":i===8?(g.maxRound===9?"vote":"—"):i===3?"tier 2":i===6?"tier 3":"";
    const e=$(`<div class="slot ${filled?"filled":""} ${now?"now":""}" data-slot="${i+1}"><div class="n">${i+1}</div>${filled?`<div class="cards">${s.cards.map(id=>MGMT.find(m=>m[0]===id)[2]).join("<br>")}</div>`:`<div>${label}</div>`}${s&&s.issues&&s.issues.length?`<div title="${s.issues.length} Issue card${s.issues.length===1?"":"s"}: +${s.issues.length} draw">${s.issues.map(()=>'<span class="iss"></span>').join("")}</div>`:""}</div>`);
    if(filled)e.title=s.cards.map(id=>{const m=MGMT.find(x=>x[0]===id);return m[2]+": "+m[3];}).join("\n");
    row.appendChild(e); }
  el.appendChild(row);
  if(g.phase==="absorb"){ const m=MGMT.find(x=>x[0]===g.mgmt.card); const sts=stewardsAvail(g); const anySeat=g.orgs.some((o,i)=>controls(i));
    const box=$(`<div class="prompt" style="margin-top:10px"><div style="font-family:'Barlow Condensed';font-size:18px">Management is about to play: ${esc(m[2])}</div><div style="font-weight:400">${esc(m[3])}</div>
      <div style="font-weight:400;margin-top:6px">Each Steward has one absorb per game. Tick the ones allowed to spend it if this card hits their department, then resolve.</div><div id="abs" style="margin-top:6px"></div></div>`);
    const list=box.querySelector("#abs");
    sts.forEach(st=>list.appendChild($(`<label style="display:block;font-weight:500"><input type="checkbox" data-id="${st.id}"> ${esc(st.name)} may absorb in ${DEPTS[st.dept][0]}</label>`)));
    const b=$(`<button class="primary" data-act="absorb" style="margin-top:8px" ${anySeat?"":"disabled"}>Resolve the card</button>`);
    b.onclick=()=>{ const allow={}; list.querySelectorAll("input:checked").forEach(i=>allow[i.dataset.id]=true); act(g=>doAbsorbDecision(g,allow)); };
    box.appendChild(b); if(!anySeat)box.appendChild($(`<div class="small">Waiting for a seated player.</div>`)); el.appendChild(box); }
  const slot=g.row[g.round-1];
  if(slot&&slot.cards.length){ el.appendChild($(`<h3 style="margin-top:10px">This round management played</h3>`)); const cs=$(`<div class="mcards"></div>`);
    slot.cards.forEach(id=>{const m=MGMT.find(x=>x[0]===id);cs.appendChild($(`<div class="mcard t${m[1]}"><div class="tier">TIER ${m[1]}</div><b>${m[2]}</b><div class="how">${m[3]}</div></div>`));}); el.appendChild(cs); }
  const fl=[]; if(g.flags.consultant)fl.push("Consultant: One-on-Ones and Maps cost 2 this round"); if(g.flags.noMap)fl.push("Pizza Friday: no Map actions this round"); if(g.flags.noMapNext)fl.push("Pizza Friday: no Map actions next round"); if(g.flags.reorg)fl.push(`${DEPTS[g.flags.reorg][0]} reorganized: no Steward or Influence there this round`); if(g.flags.decert)fl.push(`${DEPTS[g.flags.decert][0]} decertified`); if(g.flags.vdc)fl.push("Vote Delay Challenge in effect"); if(g.flags.overtime)fl.push("Mandatory Overtime: 2 actions this round instead of 3"); if(g.orgs.some(o=>o.townhall))fl.push("Town Hall: each organizer's next One-on-One costs 2");
  if(fl.length)el.appendChild($(`<div class="small" style="margin-top:8px;color:var(--red)">${fl.map(esc).join(" · ")}</div>`));
}
function renderRight(el,g){
  const mine=g.phase==="org"&&controls(g.cur)&&!(g.pending&&g.pending.length);
  const used=3-winsLeft(g);
  const ip=$(`<div class="panel stack"><h2>Issues</h2><div class="small">Small Win slots: ${"■".repeat(used)}${"□".repeat(3-used)} · ${winsLeft(g)} left this game</div></div>`);
  ISSUES.forEach(def=>{ const st=g.issues.find(i=>i.id===def.id); const n=readyCount(g,def.id); const R=def.id==="wild"?reqN(g)+1:reqN(g); const ready=st.state==="open"&&n>=R&&winsLeft(g)>0;
    const who=def.icon==="any"?"":onBoard(g).filter(w=>w.disp>=3&&w.issues.includes(def.icon)).map(w=>w.name).join(", ");
    const hold=(def.icon==="Pay"||def.icon==="Crunch")?onBoard(g).filter(w=>w.lock===def.icon&&locked(g,w)).length:def.id==="wild"?onBoard(g).filter(w=>locked(g,w)).length:0;
    const need=(def.icon==="any"?`Needs ${R} Signed or Steward workers sharing any one icon.`:`Needs ${R} Signed or Steward workers with ${def.icon}. Have ${n}${who?": "+who:""}.`)+(hold?` Unlocks ${hold} holdout${hold===1?"":"s"} on the board.`:"");
    const cost=`Cost: ${g.fear>=8?"2 actions (Fear 8+)":"1 action"}, and management draws +1 next round. Effect: every worker with ${def.icon==="any"?"the chosen icon":def.icon} moves up one, Fear ${def.id==="harass"?"−2":"−1"}. Then: ${def.x}`;
    const e=$(`<div class="issue ${ready?"ready":""} ${st.state==="done"?"done":st.state==="gone"?"gone":""}" data-issue="${def.id}"><div><b>${def.n}</b><small>${st.state==="open"?(winsLeft(g)>0?need:"No Small Win slots left. ")+" Then: "+def.x:st.state==="done"?"In effect: "+def.x:"Lost to Counter-Offer."}</small></div><div class="req">${st.state==="open"?`${Math.min(n,R)}/${R}`:st.state==="done"?"won":"lost"}</div></div>`);
    e.title=need+" "+cost;
    if(mine&&armed==="win"&&ready){e.style.cursor="pointer";e.style.boxShadow="0 0 0 2px var(--sel)";e.onclick=()=>act(g=>doSmallWin(g,g.cur,def.id));}
    ip.appendChild(e); });
  el.appendChild(ip);
  const lg=$(`<div class="panel"><h2>Log</h2><div class="log"></div></div>`); const L=lg.querySelector(".log");
  g.log.slice().reverse().forEach(x=>L.appendChild($(`<div class="${x.r?"r":""}">${esc(x.r||x.t)}</div>`)));
  el.appendChild(lg);
}
/* ============ TUTORIAL / CALLOUTS / RULES ============ */
/* The guided game and the first-time callouts live in tutorial.js and run on the
   studio kit's tutorial engine (../kit/tutorial.js): goals the player reaches
   their own way, never a locked board. */
const TUT_HELPERS={onBoard:(g,d)=>onBoard(g,d),won:(g,id)=>won(g,id),locked:(g,w)=>locked(g,w)};
let guide=null, guideGame=null, callouts=null, lastHint=null;
function startTutorial(){
  if(unsub){unsub();unsub=null;} code=null; try{ if(location.hash)history.replaceState(null,"",location.pathname+location.search); }catch(e){}
  const seats=[{k:"senior",playerId:myId}];
  const g=newGame(seats,7,TUT.TUT_SCRIPT); g.hotseat=true; g.local=true; g.seats=seats; g.tutorial={status:"active",index:0,seen:[],done:false}; g.created=Date.now(); g.run=newId();
  guide=null;
  setupFlips(g); startRound(g); armed=null; record(null,g); write(g);
}
// The guide for this game, made once per game and kept in step with g.tutorial.
function guideOf(g){
  if(!g.tutorial)return null;
  if(!guide||guideGame!==g.seed+":"+g.created){ guide=TUT.guideFor(g,TUT_HELPERS); guideGame=g.seed+":"+g.created; }
  return guide;
}
function saveGuide(g){ const snap=guide.snapshot(); recordTutorial(g.tutorial||{},snap); g.tutorial={...snap,done:snap.status!=="active"}; if(g.local)localSave.write(g); }
function tutorialNext(){ const g=G; const t=guideOf(g); if(!t)return; t.next(g); saveGuide(g); armed=null; write(g); }
function tutorialSkip(){ const g=G; const t=guideOf(g); if(!t)return; t.skip(); saveGuide(g); armed=null; write(g); }
// Hints come with time: look again every few seconds and redraw when one is due.
setInterval(()=>{ if(!G||!guide||!G.tutorial||G.tutorial.done)return; const h=guide.hint(G); const id=h?h.body:null; if(id!==lastHint)render(); },4000);
function renderGuide(root,g){
  if(g.phase==="over")return;
  const grid=root.querySelector(".grid");
  const t=guideOf(g);
  if(t&&t.status==="active"){
    const before=t.index; const st=t.observe(g); if(t.index!==before||t.status!=="active")saveGuide(g);
    if(st){
      const goals=t.steps.filter(x=>!x.next); const gi=goals.indexOf(st);
      const done=t.steps.slice(0,t.index).filter(x=>!x.next).length;
      const h=st.next?null:t.hint(g); lastHint=h?h.body:null;
      const card=$(`<div class="tut"><div class="tprog" aria-label="Tutorial progress">${goals.map((x,k)=>`<span class="seg ${k<done?"done":k===gi?"now":""}" title="${esc(x.title)}"></span>`).join("")}<span class="plab">${gi>=0?`Goal ${gi+1} of ${goals.length}`:t.index===0?"Guided game":"Guided game complete"}</span></div><div class="th"><h2>${st.title}</h2></div><p>${st.body}</p>${h?`<p class="hint" role="status"><b>Hint:</b> ${h.body}</p>`:""}
        <div class="row">${st.next?`<button class="primary" data-always onclick="tutorialNext()">${t.index===t.steps.length-1?"Finish the tutorial":"Let's go"}</button>`:`<span class="small" style="margin-left:0">Any route counts. Stuck? A hint appears after a while.</span>`}<button class="ghost" data-always onclick="tutorialSkip()">Skip tutorial</button></div></div>`);
      root.insertBefore(card,grid);
      if(st.spot)root.querySelectorAll(st.spot).forEach(e=>e.classList.add("tut-spot"));
      document.body.classList.add("tut-on");
    }
  } else document.body.classList.remove("tut-on");
  if(!callouts)callouts=TUT.calloutsFor(TUT_HELPERS);
  const c=callouts.observe(g);
  if(!c)return;
  const card=$(`<div class="callout"><h2>${c.title}</h2><p>${c.body}</p><div class="row"><button class="primary" data-always>Got it</button><span class="small">Shown once, the first time it happens.</span></div></div>`);
  card.querySelector("button").onclick=()=>{ callouts.next(G); render(); };
  root.insertBefore(card,grid);
}
/* rules reference, generated from the same tables the engine plays by */
function openRules(){
  if(document.querySelector(".rules"))return;
  const tier=t=>MGMT.filter(m=>m[1]===t).map(m=>`<tr><td class="k">${esc(m[2])}</td><td>${esc(m[3])}</td></tr>`).join("");
  const el=$(`<div class="rules" role="dialog" aria-label="Rules"><div class="sheet">
    <div class="sh"><h1 style="font-size:28px">Card Check: the rules</h1><span class="spacer"></span><button class="primary" id="rclose">Close</button></div>
    <p>A cooperative game for 1 to 6 organizers running a union drive inside a game studio. Everyone wins or loses together.</p>
    <h2>The goal</h2>
    <p>Get a majority of the 32 workers to <b>Signed</b> or <b>Steward</b> by the vote, which happens after round 8's organizer phase and status check: <b>21</b> with one to three organizers, <b>24</b> with four or more. You lose at once if every organizer burns out, and at the end of any round where Fear is 10.</p>
    <h2>The board</h2>
    <p>Four departments (Engineering, Art, QA, Production), eight workers each. Workers start face down in their department pile; Map reveals them. Every worker has a disposition: <b>Hostile, Undecided, Leaning, Signed, Steward</b>.</p>
    <ul><li><b>Dots</b> are influence. When a worker reaches Signed, you move up to that many colleagues in their department up one step.</li>
    <li><b>★</b> marks a Leader. Only Signed Leaders can become Stewards. A <b>Hostile</b> Leader drags one worker in their department down a step every round.</li>
    <li><b>Issues</b> on the card (Pay, Crunch, Layoffs, Credit, Harassment) are what the worker cares about. A worker with no issues is immovable.</li>
    <li><b>🔒 Holdouts</b> stop at Leaning until the matching Issue (Pay Transparency or End Crunch) is won.</li>
    <li><b>Contract</b> workers can be removed by Contract Ends. A removed worker's desk is filled by a <b>Plant</b>: Hostile, immovable, and +1 to every One-on-One in that department.</li>
    <li><b>⚑ Two workers change the rules by where they sit.</b> Reggie (Engineering): while Hostile, Fear +1 at every status check. Pete (QA): while Signed, Mapping any department costs 1 action.</li></ul>
    <h2>A round</h2>
    <ol style="padding-left:20px"><li><b>Management</b> draws and resolves cards: 1 per round, +1 from round 7, +1 at 12 and again at 20 Signed, +1 for each Small Win you took last round. Tier 1 cards in rounds 1 to 3, tier 2 from round 4, tier 3 from round 7. Before an absorbable card resolves, you choose which Stewards may spend their absorb on it.</li>
    <li><b>Stewards</b> each bring one worker in their department up a step.</li>
    <li><b>Hostile Leaders</b> each drag one worker down.</li>
    <li><b>Organizers</b> take turns spending actions. First player rotates each round.</li>
    <li><b>Status check.</b> Fear 10: the drive collapses. Fear 7 to 9: every organizer takes +1 Burnout. After round 8, the vote.</li></ol>
    <h2>Actions</h2>
    <table><tr><th>Action</th><th>Cost</th><th>Effect</th></tr>
    <tr><td class="k">Map</td><td>1 in your home department. 2 elsewhere, or 1 once someone there is Signed, while Pete is Signed, or after Convert the Contractors.</td><td>Reveal the top worker of any department pile.</td></tr>
    <tr><td class="k">One-on-One</td><td>1. 2 when Fear is 7+, under a Union Avoidance Consultant, or after a Town Hall. +1 per Plant in the department. 0 once per round in a department with a Steward.</td><td>Move a revealed worker up one step.</td></tr>
    <tr><td class="k">Small Win</td><td>1. 2 when Fear is 8+.</td><td>Resolve an Issue whose requirement is met: 3 Signed or Steward workers sharing its icon (4 for Just Cause). Every worker with that icon moves up a step, Fear −1, its rule applies for the rest of the game, and management draws +1 next round. Three per game.</td></tr>
    <tr><td class="k">Build Committee</td><td>2</td><td>A Signed Leader becomes a Steward.</td></tr>
    <tr><td class="k">Reassure</td><td>1, once per round for the committee</td><td>Fear −1.</td></tr>
    <tr><td class="k">Reset</td><td>1</td><td>Remove one Burnout from yourself.</td></tr>
    <tr><td class="k">Overwork</td><td>+1 Burnout, once per round (free once End Crunch is won). Not available at Burnout 3.</td><td>+1 action this round.</td></tr></table>
    <h2>Fear and Burnout</h2>
    <p><b>Fear</b> starts at 3. Management cards raise it; Reassure and Small Wins lower it. At 7, One-on-Ones cost 2 and everyone takes Burnout at round end. At 8, Small Wins cost 2. At 10, you lose at the status check.</p>
    <p><b>Burnout</b> per organizer: 0 or 1 gives 3 actions, 2 gives 2 actions, 3 gives 1 action and no ability. All organizers at 3 is a loss.</p>
    <h2>Stewards</h2>
    <p>A Steward gives one free One-on-One in their department per round, brings one worker up at the start of each round, and can <b>absorb</b> one management card per game to cancel its effect in their department. Stewards cannot be moved down.</p>
    <h2>Organizers</h2>
    <table>${ORGS.map(o=>`<tr><td class="k">${esc(o.n)}</td><td>${DEPTS[o.d][0]}</td><td>${esc(o.a)}</td></tr>`).join("")}</table>
    <h2>Issues</h2>
    <table>${ISSUES.map(i=>`<tr><td class="k">${esc(i.n)}</td><td>${i.icon==="any"?"4 sharing any one icon":"3 with "+i.icon}</td><td>${esc(i.x)}</td></tr>`).join("")}</table>
    <h2>Management cards</h2>
    <h3>Tier 1 (rounds 1 to 3)</h3><table>${tier(1)}</table>
    <h3>Tier 2 (from round 4)</h3><table>${tier(2)}</table>
    <h3>Tier 3 (from round 7)</h3><table>${tier(3)}</table>
    <h2>Symbols</h2>
    <p>● influence · ★ Leader · ⚑ special rule · 🔒 holdout · ⛨ Steward absorb ready · ⊘ absorb spent · ⟲ department reorganized this round · ✕ department decertified</p>
    <div class="row" style="margin-top:16px"><button class="primary" id="rclose2">Close</button></div>
  </div></div>`);
  const close=()=>{el.remove();document.removeEventListener("keydown",onk);};
  const onk=e=>{if(e.key==="Escape")close();};
  el.querySelector("#rclose").onclick=close; el.querySelector("#rclose2").onclick=close;
  el.addEventListener("click",e=>{if(e.target===el)close();});
  document.addEventListener("keydown",onk);
  document.body.appendChild(el);
}
function arm(a){armed=armed===a?null:a;render();}
async function act(fn){ if(G.phase==="org"&&!controls(G.cur)){toast("Not your turn.");return;} if(G.phase!=="org"&&!g0AnySeat()){toast("Only a seated player can do that.");return;} await mutate(g=>{ const err=fn(g); if(err)return err; armed=null; return null; },g=>afterAction(g)); }
function g0AnySeat(){ return G.orgs?G.orgs.some((o,i)=>controls(i)):true; }
window.addEventListener("hashchange",()=>{const h=location.hash.replace("#","").toUpperCase(); if(h&&h!==code&&/^[A-Z0-9]{5}$/.test(h)&&!offline)join(h);});
// Inline onclick handlers reach these through window, since this is a module.
Object.assign(window,{openRules,tutorialNext,tutorialSkip});
mountSignupForm(document.getElementById("signup-form"),{newsletter:createNewsletter({source:"card-check",doneKey:"cc-newsletter"})});
init();
</script>
