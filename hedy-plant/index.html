<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Hedy Plant: an idle factory game about an electric car plant whose parent company takes more every time it gets better. A playtest build from Permadeath Media.">
<title>Hedy Plant · Permadeath Media</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=IBM+Plex+Mono:wght@400;600&family=IBM+Plex+Sans:wght@400;600;700&family=Source+Serif+4:ital,wght@0,400;0,600;1,400&display=swap">
<style>
/* Layout: one plant control board. Hero number up top, hand-build button, then two columns
   (contract + shift record | spend + organize) that stack on phones. Hedy's letters arrive on paper. */
:root {
  --floor: #e8ebee;
  --panel: #f7f8f9;
  --ink: #1d2228;
  --muted: #5b646e;
  --rule: #cbd2d8;
  --safety: #e0a100;
  --safety-ink: #241b00;
  --keep: #1d7a4c;
  --hedy: #2b4b8c;
  --hedy-tint: #e3e9f5;
  --fed: #a3372a;
  --fed-tint: #f6e4e0;
  --down: #b3261e;
  --paper: #fbfaf6;
  --paper-ink: #22252a;
  --scrim: rgba(20, 24, 30, 0.55);

  --display: 'Barlow Condensed', 'Arial Narrow', 'Helvetica Neue', sans-serif;
  --body: 'IBM Plex Sans', system-ui, -apple-system, 'Segoe UI', sans-serif;
  --mono: 'IBM Plex Mono', ui-monospace, 'SFMono-Regular', Menlo, monospace;
  --letter: 'Source Serif 4', Georgia, 'Times New Roman', serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme='light']) {
    --floor: #14181c;
    --panel: #1c2127;
    --ink: #e5e8eb;
    --muted: #9aa3ad;
    --rule: #333b44;
    --safety: #f2b51c;
    --safety-ink: #241b00;
    --keep: #4cc38a;
    --hedy: #93b2ef;
    --hedy-tint: #1d2940;
    --fed: #e8836b;
    --fed-tint: #3a2220;
    --down: #ff8a80;
    --scrim: rgba(0, 0, 0, 0.65);
    color-scheme: dark;
  }
}
:root[data-theme='dark'] {
  --floor: #14181c;
  --panel: #1c2127;
  --ink: #e5e8eb;
  --muted: #9aa3ad;
  --rule: #333b44;
  --safety: #f2b51c;
  --safety-ink: #241b00;
  --keep: #4cc38a;
  --hedy: #93b2ef;
  --hedy-tint: #1d2940;
  --fed: #e8836b;
  --fed-tint: #3a2220;
  --down: #ff8a80;
  --scrim: rgba(0, 0, 0, 0.65);
  color-scheme: dark;
}

html, body { background: var(--floor); }
body { color: var(--ink); font-family: var(--body); font-size: 15px; line-height: 1.45; }
* { box-sizing: border-box; }
button { font: inherit; color: inherit; }
button:focus-visible, input:focus-visible { outline: 2px solid var(--safety); outline-offset: 2px; }

.app { max-width: 1080px; margin: 0 auto; padding-inline: 16px; padding-block: 12px 48px; display: flex; flex-direction: column; gap: 16px; }

/* top bar */
.topbar { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.brand { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; min-width: 0; }
.plate { font-family: var(--display); font-weight: 700; font-size: 26px; letter-spacing: 0.04em; text-transform: uppercase; background: var(--safety); color: var(--safety-ink); padding: 0 10px; line-height: 1.25; }
.sub { color: var(--muted); font-size: 13px; letter-spacing: 0.02em; }
.topbar-right { display: flex; align-items: center; gap: 8px; }
.clock { font-family: var(--mono); font-variant-numeric: tabular-nums; color: var(--muted); }
.icon-btn { background: var(--panel); border: 1px solid var(--rule); border-radius: 6px; min-width: 34px; height: 34px; display: inline-grid; place-items: center; cursor: pointer; font-size: 18px; line-height: 1; }
.icon-btn:disabled { opacity: 0.4; cursor: default; }

.flags { background: var(--panel); border: 1px dashed var(--rule); padding: 12px 14px; display: flex; flex-direction: column; gap: 10px; font-size: 14px; }
.flag { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.chip { border: 1px solid var(--rule); background: transparent; padding: 2px 10px; border-radius: 999px; cursor: pointer; font-family: var(--mono); }
.chip.on { background: var(--ink); color: var(--floor); border-color: var(--ink); }

/* hero */
.hero { display: flex; flex-wrap: wrap; gap: 16px 32px; align-items: flex-end; justify-content: space-between; border-bottom: 2px solid var(--ink); padding-bottom: 14px; }
.eyebrow { font-size: 12px; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); }
.hero-num { font-family: var(--display); font-weight: 700; font-size: clamp(64px, 14vw, 104px); line-height: 0.9; font-variant-numeric: tabular-nums; color: var(--keep); transition: color 0.4s; }
.hero-num.down { color: var(--down); }
.hero-note { color: var(--muted); font-size: 14px; margin-top: 4px; }
.stats { display: grid; grid-template-columns: repeat(4, auto); gap: 4px 24px; margin: 0; }
.stats div { display: flex; flex-direction: column; }
.stats dt { font-size: 12px; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); }
.stats dd { margin: 0; font-family: var(--mono); font-size: 20px; font-variant-numeric: tabular-nums; }
.stats small { font-size: 12px; color: var(--muted); }
@media (max-width: 560px) { .stats { grid-template-columns: repeat(2, minmax(0, 1fr)); width: 100%; } }

/* hand build */
.build { display: flex; flex-direction: column; gap: 6px; }
.build-btn { position: relative; overflow: hidden; display: flex; align-items: center; gap: 12px; width: 100%; padding: 18px 20px; background: var(--safety); color: var(--safety-ink); border: 0; border-radius: 4px; cursor: pointer; font-family: var(--display); font-weight: 700; font-size: 24px; letter-spacing: 0.03em; text-transform: uppercase; user-select: none; -webkit-tap-highlight-color: transparent; touch-action: manipulation; }
.build-btn small { margin-left: auto; font-family: var(--mono); font-size: 13px; font-weight: 400; text-transform: none; letter-spacing: 0; }
.build-btn:active { transform: translateY(1px); }
.progress { position: absolute; left: 0; bottom: 0; height: 6px; width: calc(var(--p) * 100%); background: var(--safety-ink); opacity: 0.55; transition: width 0.08s; }
.sold { position: absolute; right: 20px; top: 2px; font-family: var(--mono); font-size: 14px; animation: rise 0.9s ease-out forwards; }
.sold.idle { display: none; }
@keyframes rise { from { opacity: 1; transform: translateY(8px); } to { opacity: 0; transform: translateY(-10px); } }
@media (max-width: 480px) { .build-btn small { display: none; } .build-btn { font-size: 21px; } }
.build-meta { font-family: var(--mono); font-size: 12px; color: var(--muted); }
.stoppage { display: flex; gap: 8px; align-items: flex-start; font-size: 13px; color: var(--down); border: 1px solid currentColor; border-radius: 8px; padding: 6px 10px; }
.stoppage svg { flex: none; margin-top: 2px; }
.stoppage span { color: var(--ink, inherit); }

/* columns */
.cols { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 16px; align-items: start; }
.col { display: flex; flex-direction: column; gap: 16px; min-width: 0; }
@media (max-width: 820px) { .cols { grid-template-columns: minmax(0, 1fr); } }

.panel { background: var(--panel); border: 1px solid var(--rule); padding: 14px 16px 16px; display: flex; flex-direction: column; gap: 12px; min-width: 0; }
.panel-head { display: flex; justify-content: space-between; align-items: center; gap: 8px; flex-wrap: wrap; }
.panel h2 { margin: 0; font-family: var(--display); font-weight: 600; font-size: 22px; text-transform: uppercase; letter-spacing: 0.04em; }
.muted { color: var(--muted); margin: 0; font-size: 14px; }
.fine { font-size: 13px; color: var(--muted); }

/* contract */
.pill { font-size: 12px; padding: 2px 8px; border-radius: 999px; background: var(--hedy-tint); color: var(--hedy); font-weight: 600; }
.pill-federation { background: var(--fed-tint); color: var(--fed); }
.ledger { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; }
.ledger th { text-align: left; font-weight: 400; padding: 5px 0; }
.ledger td { text-align: right; font-family: var(--mono); padding: 5px 0; white-space: nowrap; }
.ledger tr + tr th, .ledger tr + tr td { border-top: 1px solid var(--rule); }
.ledger tr:nth-child(2) td, .ledger tr:nth-child(3) td { color: var(--hedy); }
.ledger .total th { font-weight: 700; }
.ledger .total th, .ledger .total td { border-top: 2px solid var(--ink); font-size: 17px; }
.ledger .total td { color: var(--keep); font-weight: 600; }
.review { display: flex; flex-direction: column; gap: 6px; font-size: 14px; color: var(--muted); }
.review b { color: var(--hedy); font-family: var(--mono); font-weight: 600; }
.meter { display: block; height: 6px; background: var(--rule); position: relative; overflow: hidden; }
.meter::after { content: ''; position: absolute; inset: 0 auto 0 0; width: calc(var(--p) * 100%); background: var(--hedy); }
.packet { border-top: 1px dashed var(--rule); padding-top: 10px; }
.packet p { margin: 4px 0 0; }
.packet b { font-family: var(--mono); color: var(--hedy); font-size: 18px; }

/* charts */
.legend { font-size: 12px; color: var(--muted); display: inline-flex; align-items: center; gap: 6px; }
.evt-key { display: inline-block; width: 0; height: 12px; border-left: 2px dashed var(--hedy); }
.spark { display: flex; flex-direction: column; gap: 2px; }
.spark-label { font-size: 13px; color: var(--muted); }
.spark-label b { font-family: var(--mono); font-weight: 600; margin-left: 4px; }
.spark svg { width: 100%; height: 78px; display: block; overflow: visible; }
.spark-empty { height: 78px; display: grid; place-items: center; font-size: 13px; color: var(--muted); border: 1px dashed var(--rule); }
.axis { stroke: var(--ink); stroke-width: 1; vector-effect: non-scaling-stroke; }
.grid { stroke: var(--rule); stroke-width: 1; stroke-dasharray: 2 3; vector-effect: non-scaling-stroke; }
.evt { stroke: var(--hedy); stroke-width: 1.5; stroke-dasharray: 3 3; vector-effect: non-scaling-stroke; }
.evt-claw { stroke: var(--down); }
.line { stroke-width: 2; vector-effect: non-scaling-stroke; }
.line.tone-ink { stroke: var(--ink); }
.line.tone-keep { stroke: var(--keep); }
.area { opacity: 0.12; }
.area.tone-ink { fill: var(--ink); }
.area.tone-keep { fill: var(--keep); }
.dot.tone-ink { fill: var(--ink); }
.dot.tone-keep { fill: var(--keep); }
b.tone-ink { color: var(--ink); }
b.tone-keep { color: var(--keep); }

/* shop */
.shop-group { display: flex; flex-direction: column; gap: 6px; }
.shop-group h3 { margin: 4px 0 0; font-size: 12px; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); font-weight: 600; }
.item { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 10px; align-items: center; text-align: left; padding: 10px 12px; background: var(--floor); border: 1px solid var(--rule); border-left: 4px solid var(--safety); cursor: pointer; }
.item:not(:disabled):hover { border-color: var(--ink); border-left-color: var(--safety); }
.item.kind-floor { border-left-color: var(--keep); }
.item.kind-workflow, .item.kind-program { border-left-color: var(--ink); }
.item.short { cursor: default; color: var(--muted); }
.item-text { display: flex; flex-direction: column; min-width: 0; }
.item-name { font-weight: 600; color: var(--ink); }
.item-name small { font-weight: 400; color: var(--muted); font-family: var(--mono); }
.item-desc { font-size: 13px; }
.item-cost { font-family: var(--mono); text-align: right; display: flex; flex-direction: column; font-variant-numeric: tabular-nums; color: var(--ink); }
.short-by { font-size: 11px; color: var(--muted); }
.owned { font-size: 13px; color: var(--muted); }

/* organize */
.organize.locked { opacity: 0.7; }
.lp { font-family: var(--mono); color: var(--fed); display: inline-flex; align-items: center; gap: 4px; font-variant-numeric: tabular-nums; }
.stepper { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.stepper b { font-family: var(--mono); font-size: 18px; min-width: 2ch; text-align: center; }
.ladder { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 6px; }
.ladder li { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 10px; align-items: center; padding: 10px 12px; border: 1px solid var(--rule); }
.ladder li.open { border-left: 4px solid var(--fed); }
.ladder li.done { background: var(--fed-tint); }
.ladder li.later { color: var(--muted); }
.rung-name { font-weight: 600; }
.rung-desc { font-size: 13px; color: var(--muted); }
.btn { border: 1px solid transparent; padding: 7px 12px; border-radius: 4px; cursor: pointer; white-space: nowrap; }
.btn:disabled { opacity: 0.45; cursor: default; }
.btn-primary { background: var(--ink); color: var(--floor); }
.btn-org { background: var(--fed); color: var(--panel); font-family: var(--mono); font-size: 13px; }
.btn-quiet { background: transparent; border-color: var(--rule); }
.btn-danger { background: var(--down); color: var(--panel); }

.mailcount { position: fixed; right: 16px; bottom: calc(16px + env(safe-area-inset-bottom, 0px)); background: var(--hedy); color: var(--panel); padding: 4px 10px; border-radius: 999px; font-size: 13px; display: inline-flex; gap: 6px; align-items: center; z-index: 9; }

/* letters */
.scrim { position: fixed; inset: 0; background: var(--scrim); display: grid; place-items: center; padding: 16px; z-index: 10; overflow-y: auto; }
.letter { background: var(--paper); color: var(--paper-ink); width: min(560px, 100%); padding: 24px 24px 20px; font-family: var(--letter); box-shadow: 0 12px 40px rgba(0, 0, 0, 0.3); display: flex; flex-direction: column; gap: 12px; animation: slide 0.35s ease-out; }
@keyframes slide { from { transform: translateY(16px); opacity: 0; } to { transform: none; opacity: 1; } }
.letter header { border-bottom: 3px double #2b4b8c; padding-bottom: 10px; }
.letter.from-fed header { border-bottom-color: #a3372a; }
.letter-from { font-family: var(--body); font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; font-size: 13px; color: #2b4b8c; }
.letter.from-fed .letter-from { color: #a3372a; }
.letter-meta { font-family: var(--mono); font-size: 12px; color: #6a6f76; }
.letter h2 { margin: 8px 0 0; font-size: 22px; font-weight: 600; text-wrap: balance; }
.letter-body p { margin: 0 0 10px; max-width: 62ch; }
.letter .fine { color: #6a6f76; }
.letter .sig { font-style: italic; }
.letter .btn-primary { align-self: flex-end; background: #22252a; color: #fbfaf6; font-family: var(--body); }
.diff { width: 100%; border-collapse: collapse; margin: 4px 0 12px; font-family: var(--body); font-size: 14px; font-variant-numeric: tabular-nums; }
.diff th { text-align: left; font-weight: 400; padding: 4px 0; }
.diff td { font-family: var(--mono); text-align: right; padding: 4px 0 4px 8px; white-space: nowrap; }
.diff tr.changed td:last-child { color: #2b4b8c; font-weight: 600; }
.diff tr.bottom th, .diff tr.bottom td { border-top: 1px solid #22252a; font-weight: 600; }
.diff tr.bottom td:last-child { color: #b3261e; }

@media (prefers-reduced-motion: reduce) {
  .sold, .letter { animation: none; }
  .progress, .hero-num { transition: none; }
}

/* act 2: the co-op */
.ledger.sales tr td { color: inherit; }
.ledger.sales thead td, .ledger.sales thead th { font-family: var(--mono); font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.05em; padding-bottom: 2px; }
.ledger.sales th small { display: block; font-size: 12px; color: var(--muted); }
.ledger.sales td + td { padding-left: 12px; }
.ledger.sales .total td { color: var(--keep); }
.costs { margin: 8px 0 0; font-size: 13px; color: var(--muted); }
.costs b { color: var(--keep); font-family: var(--mono); }
.hedy-push { display: flex; flex-direction: column; gap: 4px; color: var(--hedy); }
.sub-h { font-size: 13px; text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted); margin: 14px 0 6px; }
.decided { border-top: 1px dashed var(--rule); margin-top: 12px; padding-top: 8px; }
.decided ul { list-style: none; margin: 4px 0 0; padding: 0; display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: 13px; }
.decided li { display: inline-flex; align-items: center; gap: 4px; }
.item.kind-venture { border-left-color: var(--fed); }
.vote-options { display: flex; flex-direction: column; gap: 8px; }
.vote-opt { text-align: left; background: #fbfaf6; border: 1px solid #c9c3b4; border-left: 4px solid #a3372a; padding: 10px 12px; font-family: var(--body); color: var(--paper-ink); cursor: pointer; display: flex; flex-direction: column; gap: 2px; }
.vote-opt:hover, .vote-opt:focus-visible { background: #f1ede2; }
.vote-opt span { font-size: 14px; color: #4a4f56; }
@media (max-width: 520px) {
  .ladder li > .btn { grid-column: 2 / -1; justify-self: start; }
}

/* site build only (src/site.jsx): cloud save, mailing-list asks on milestone letters, share */
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.site-ask { border-top: 1px solid #d8d4c8; padding-top: 12px; font-family: var(--body); font-size: 14px; display: flex; flex-direction: column; gap: 10px; }
.site-ask h3 { margin: 0; font-family: var(--display); font-size: 20px; text-transform: uppercase; letter-spacing: 0.02em; }
.site-form { display: flex; flex-direction: column; gap: 8px; }
.site-lede { margin: 0; max-width: 62ch; }
.site-row { display: flex; flex-wrap: wrap; gap: 8px; }
.site-row input { flex: 1 1 180px; min-width: 0; font: inherit; padding: 7px 10px; border: 1px solid #b9b5aa; border-radius: 4px; background: #fff; color: #22252a; }
.site-dialog .site-row input { border-color: var(--rule); background: var(--floor); color: var(--ink); }
.letter .site-row .btn-primary { align-self: auto; }
.site-check { display: flex; gap: 8px; align-items: flex-start; font-size: 13px; color: #5b5f66; cursor: pointer; }
.site-dialog .site-check { color: var(--muted); }
.site-check input { margin-top: 2px; }
.site-err { margin: 0; color: var(--down); font-size: 13px; }
.site-ok { margin: 0; color: var(--keep); }
.letter .site-ok { color: #1d7a4c; }
.site-share { display: inline-flex; gap: 8px; align-items: center; align-self: flex-start; font-family: var(--body); color: inherit; }
.site-dialog { position: relative; background: var(--panel); color: var(--ink); border: 1px solid var(--rule); width: min(460px, 100%); padding: 20px; display: flex; flex-direction: column; gap: 12px; box-shadow: 0 12px 40px rgba(0, 0, 0, 0.3); }
.site-dialog h2 { margin: 0; font-family: var(--display); font-size: 24px; text-transform: uppercase; }
.site-dialog p { margin: 0; }
.site-close { position: absolute; top: 12px; right: 12px; }
.site-toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(16px + env(safe-area-inset-bottom, 0px)); background: var(--ink); color: var(--floor); padding: 8px 14px; border-radius: 6px; font-size: 14px; z-index: 11; }

/* shift guide (tutorial) */
.tut-hl { outline: 3px solid var(--safety); outline-offset: 4px; box-shadow: 0 0 0 8px color-mix(in srgb, var(--safety) 22%, transparent); transition: box-shadow 0.3s; }
.guide-box { background: var(--panel); color: var(--ink); width: min(480px, 100%); border-top: 6px solid var(--safety); padding: 20px 22px 18px; box-shadow: 0 12px 40px rgba(0, 0, 0, 0.3); display: flex; flex-direction: column; gap: 10px; animation: slide 0.35s ease-out; }
.guide-box h2 { margin: 0; font-family: var(--display); font-size: 28px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.02em; line-height: 1.1; }
.guide-box p { margin: 0; max-width: 62ch; }
.guide-actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 4px; }
.guide-actions .btn { flex: 1 1 180px; }
.guide-box.help { max-height: calc(100vh - 32px); overflow-y: auto; }
.help-step { border-top: 1px solid var(--rule); padding-top: 10px; display: flex; flex-direction: column; gap: 6px; }
.help-step h3 { margin: 0; font-size: 15px; }
.help-step p { font-size: 14px; color: var(--muted); }
.guide-card { position: fixed; left: 16px; right: 16px; bottom: calc(12px + env(safe-area-inset-bottom, 0px)); z-index: 9; margin: 0 auto; max-width: 460px; max-height: 45vh; overflow-y: auto; background: var(--panel); color: var(--ink); border: 1px solid var(--rule); border-left: 6px solid var(--safety); padding: 12px 14px; box-shadow: 0 8px 28px rgba(0, 0, 0, 0.28); display: flex; flex-direction: column; gap: 6px; animation: slide 0.35s ease-out; }
.guide-card h2 { margin: 0; font-family: var(--display); font-size: 22px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.02em; line-height: 1.1; }
.guide-card p { margin: 0; font-size: 14px; }
.guide-head { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.guide-paused { font-family: var(--mono); font-size: 11px; text-transform: uppercase; letter-spacing: 0.06em; background: var(--safety); color: var(--safety-ink); padding: 1px 6px; }
.guide-foot { display: flex; justify-content: space-between; align-items: center; gap: 8px; flex-wrap: wrap; margin-top: 4px; }
.link-btn { background: none; border: 0; padding: 2px 0; color: var(--muted); font-size: 13px; text-decoration: underline; cursor: pointer; }
.guide-spacer { height: 40vh; }
@media (prefers-reduced-motion: reduce) {
  .guide-box, .guide-card { animation: none; }
  .tut-hl { transition: none; }

<style>
.site-foot { max-width: 1080px; margin: 0 auto; padding: 0 16px 32px; display: flex; flex-direction: column; gap: 12px; font-family: var(--body); color: var(--ink); }
.signup { border: 1px solid var(--rule); background: var(--panel); padding: 14px 16px; display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: center; }
.signup .txt { flex: 1 1 260px; min-width: 0; }
.signup h2 { margin: 0; font-family: var(--display); font-size: 20px; text-transform: uppercase; letter-spacing: .02em; }
.signup p { margin: 2px 0 0; font-size: 13px; color: var(--muted); }
.signup form { display: flex; flex-wrap: wrap; gap: 8px; flex: 1 1 300px; align-items: center; }
.signup input[type=email] { flex: 1 1 180px; min-width: 0; font: inherit; padding: 7px 10px; border: 1px solid var(--rule); background: var(--floor); color: var(--ink); border-radius: 4px; }
.signup button { font: inherit; font-weight: 600; padding: 7px 14px; border: 0; border-radius: 4px; background: var(--ink); color: var(--floor); cursor: pointer; }
.signup button:disabled { opacity: .5; cursor: default; }
.signup .hp { position: absolute; left: -9999px; width: 1px; height: 1px; opacity: 0; }
.signup .msg { flex: 1 1 100%; font-size: 13px; color: var(--muted); min-height: 1.2em; margin: 0; }
.signup .msg.ok { color: var(--keep); }
.signup .msg.err { color: var(--down); }
.signup .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.credit { margin: 0; font-size: 13px; color: var(--muted); }
.credit a { color: inherit; }
</style>
<footer class="site-foot">
  <div class="signup" id="signup">
    <div class="txt">
      <h2>Hear when Hedy Plant changes</h2>
      <p>New playtest builds, new games and the occasional note from Permadeath Media. A few emails a year.</p>
    </div>
    <form id="signup-form" novalidate>
      <label class="sr" for="signup-email">Email address</label>
      <input id="signup-email" name="email" type="email" inputmode="email" autocomplete="email" placeholder="you@example.com" required>
      <input class="hp" name="website" type="text" tabindex="-1" autocomplete="off" aria-hidden="true">
      <button type="submit">Sign up</button>
      <p class="msg" id="signup-msg" role="status" aria-live="polite"></p>
    </form>
  </div>
  <p class="credit">Hedy Plant is a <a href="/">Permadeath Media</a> playtest build. Numbers and rules are subject to change.</p>
</footer>
